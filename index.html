<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoView</title>

<style>
:root{
    --bg:#0f0f0f;
    --surface:#181818;
    --surface2:#222;
    --hover:#272727;
    --text:#f1f1f1;
    --muted:#aaa;
    --border:#303030;
    --accent:#7c5cff;
}

body.light{
    --bg:#fff;
    --surface:#f8f8f8;
    --surface2:#eee;
    --hover:#e5e5e5;
    --text:#111;
    --muted:#606060;
    --border:#ddd;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

img{
    display:block;
    max-width:100%;
}

a{
    color:inherit;
    text-decoration:none;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    height:64px;

    display:flex;
    align-items:center;

    padding:0 18px;

    background:var(--bg);
    border-bottom:1px solid var(--border);
}

.header-left{
    width:240px;

    display:flex;
    align-items:center;
    gap:16px;

    flex-shrink:0;
}

.menu-btn,
.header-icon{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    display:grid;
    place-items:center;

    background:transparent;
    color:var(--text);
}

.menu-btn:hover,
.header-icon:hover{
    background:var(--hover);
}

.menu-btn svg,
.header-icon svg{
    width:22px;
    height:22px;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;

    font-size:20px;
    font-weight:700;
}

.logo-icon{
    width:32px;
    height:24px;

    display:grid;
    place-items:center;

    background:#ff3b30;
    border-radius:7px;
}

.logo-icon svg{
    width:15px;
}

/* SEARCH */

.header-center{
    flex:1;
    display:flex;
    justify-content:center;
}

.search-form{
    width:min(700px,100%);
    display:flex;
}

.search-wrap{
    position:relative;
    flex:1;
}

.search-input{
    width:100%;
    height:42px;

    padding:0 42px 0 16px;

    border:1px solid var(--border);
    border-right:0;

    border-radius:22px 0 0 22px;

    background:var(--bg);
    color:var(--text);

    outline:none;
}

.search-input:focus{
    border-color:#4d7cff;
}

.clear-search{
    position:absolute;
    right:8px;
    top:50%;

    width:28px;
    height:28px;

    transform:translateY(-50%);

    border:0;
    border-radius:50%;

    background:transparent;
    color:var(--muted);
}

.search-submit{
    width:65px;
    height:42px;

    display:grid;
    place-items:center;

    border:1px solid var(--border);
    border-radius:0 22px 22px 0;

    background:var(--surface);
    color:var(--text);
}

.search-submit:hover{
    background:var(--hover);
}

/* HEADER RIGHT */

.header-right{
    width:240px;

    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
}

.profile{
    width:34px;
    height:34px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:#8246a5;
    color:#fff;

    font-size:13px;
    font-weight:700;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    top:64px;
    left:0;
    bottom:0;

    width:240px;

    padding:12px 10px;

    overflow-y:auto;

    background:var(--bg);

    z-index:900;
}

.nav-group{
    padding-bottom:12px;
    margin-bottom:10px;

    border-bottom:1px solid var(--border);
}

.nav-title{
    padding:10px 12px;

    font-size:13px;
    font-weight:700;
}

.nav-item{
    width:100%;

    min-height:45px;

    display:flex;
    align-items:center;

    gap:18px;

    padding:7px 12px;

    border:0;
    border-radius:9px;

    background:transparent;
    color:var(--text);

    text-align:left;
}

.nav-item:hover,
.nav-item.active{
    background:var(--hover);
}

.nav-item svg{
    width:21px;
    height:21px;

    flex-shrink:0;
}

.main{
    margin-left:240px;
    width:calc(100% - 240px);
}

/* TOPIC BAR */

.chips{
    position:sticky;
    top:64px;
    z-index:500;

    display:flex;
    gap:9px;

    padding:12px 20px;

    overflow-x:auto;

    background:var(--bg);
}

.chips::-webkit-scrollbar{
    display:none;
}

.chip{
    flex-shrink:0;

    padding:8px 15px;

    border:0;
    border-radius:9px;

    background:var(--surface2);
    color:var(--text);

    font-size:13px;
    font-weight:600;
}

.chip:hover{
    background:var(--hover);
}

.chip.active{
    background:var(--text);
    color:var(--bg);
}

/* HOME */

.home{
    padding:8px 22px 50px;
}

.section-title{
    margin:12px 0 18px;
    font-size:20px;
}

/* VIDEO GRID */

.video-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(280px,1fr));

    gap:28px 18px;
}

.video-card{
    cursor:pointer;
}

.thumbnail{
    position:relative;

    width:100%;
    aspect-ratio:16/9;

    overflow:hidden;

    border-radius:10px;

    background:#222;
}

.thumbnail img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:transform .2s;
}

.video-card:hover .thumbnail img{
    transform:scale(1.02);
}

.duration{
    position:absolute;

    right:7px;
    bottom:7px;

    padding:3px 5px;

    border-radius:4px;

    background:rgba(0,0,0,.85);
    color:#fff;

    font-size:11px;
}

.video-details{
    display:grid;

    grid-template-columns:40px 1fr;

    gap:10px;

    padding-top:11px;
}

.avatar{
    width:38px;
    height:38px;

    overflow:hidden;

    border-radius:50%;

    background:#444;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.video-title{
    margin:0;

    display:-webkit-box;

    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;

    font-size:15px;
    line-height:1.35;

    font-weight:600;
}

.channel{
    margin:7px 0 0;

    color:var(--muted);
    font-size:13px;
}

.meta{
    margin:3px 0 0;

    color:var(--muted);
    font-size:12px;
}

/* PLAYER PAGE */

.player-page{
    display:none;

    padding:22px 28px 50px;
}

.player-layout{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        390px;

    gap:22px;
}

.player-video{
    width:100%;
}

.youtube-container{
    position:relative;

    width:100%;
    aspect-ratio:16/9;

    overflow:hidden;

    background:#000;

    border-radius:10px;
}

.youtube-container iframe{
    width:100%;
    height:100%;

    border:0;
}

.player-error{
    position:absolute;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    text-align:center;

    background:#080808;

    padding:30px;

    color:#fff;
}

.player-error.show{
    display:flex;
}

.player-error h3{
    margin:0 0 8px;
}

.player-error p{
    margin:0 0 18px;
    color:#aaa;
}

.youtube-open-btn{
    display:inline-flex;
    align-items:center;

    padding:10px 15px;

    border-radius:8px;

    background:var(--accent);
    color:#fff;
}

.player-title{
    margin:18px 0 10px;

    font-size:25px;
    line-height:1.3;
}

.player-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;

    padding-bottom:17px;

    border-bottom:1px solid var(--border);
}

.action{
    min-height:38px;

    padding:0 14px;

    border:0;
    border-radius:18px;

    background:var(--surface2);
    color:var(--text);
}

.action:hover{
    background:var(--hover);
}

.action.active{
    background:var(--accent);
    color:#fff;
}

.player-description{
    padding-top:18px;

    color:var(--muted);

    line-height:1.65;

    white-space:pre-wrap;
}

.up-next-title{
    margin:0 0 12px;
    font-size:18px;
}

.up-next{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.next{
    display:grid;

    grid-template-columns:170px 1fr;

    gap:10px;

    cursor:pointer;
}

.next-thumb{
    aspect-ratio:16/9;

    overflow:hidden;

    border-radius:7px;

    background:#222;
}

.next-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.next-title{
    margin:0;

    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:3;

    overflow:hidden;

    font-size:13px;
    font-weight:600;

    line-height:1.35;
}

.next-channel{
    margin:6px 0 0;

    color:var(--muted);
    font-size:11px;
}

/* LIBRARY */

.library{
    display:none;

    padding:25px 22px 50px;
}

.library-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.library-header h2{
    margin:0;
}

.library-tabs{
    display:flex;
    gap:8px;

    margin:20px 0;
}

.library-tab{
    padding:9px 15px;

    border:0;
    border-radius:8px;

    background:var(--surface2);
    color:var(--text);
}

.library-tab.active{
    background:var(--text);
    color:var(--bg);
}

.library-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(280px,1fr));

    gap:20px;
}

/* SKELETON */

.skeleton .thumbnail,
.skeleton-line,
.skeleton-avatar{
    background:
        linear-gradient(
            90deg,
            var(--surface)
            25%,
            var(--hover)
            50%,
            var(--surface)
            75%
        );

    background-size:200% 100%;

    animation:skeleton 1.3s infinite;
}

.skeleton-line{
    width:100%;
    height:11px;

    margin-bottom:8px;

    border-radius:6px;
}

.skeleton-line.short{
    width:60%;
}

.skeleton-avatar{
    width:38px;
    height:38px;

    border-radius:50%;
}

@keyframes skeleton{
    from{
        background-position:200% 0;
    }
    to{
        background-position:-200% 0;
    }
}

/* TOAST */

.toast{
    position:fixed;

    right:20px;
    bottom:20px;

    z-index:3000;

    padding:12px 16px;

    border-radius:8px;

    background:#272727;
    color:#fff;

    opacity:0;

    transform:translateY(10px);

    pointer-events:none;

    transition:.2s;
}

.toast.show{
    opacity:1;

    transform:translateY(0);
}

/* MOBILE */

.sidebar-overlay{
    display:none;
}

@media(max-width:1100px){

    .sidebar{
        width:78px;
    }

    .sidebar .nav-text,
    .sidebar .nav-title{
        display:none;
    }

    .nav-item{
        justify-content:center;
    }

    .main{
        margin-left:78px;
        width:calc(100% - 78px);
    }

    .player-layout{
        grid-template-columns:1fr;
    }

    .player-sidebar{
        max-width:800px;
    }
}

@media(max-width:760px){

    .header{
        padding:0 9px;
    }

    .header-left{
        width:auto;
    }

    .logo{
        display:none;
    }

    .header-right{
        width:auto;
    }

    .header-right .header-icon:first-child{
        display:none;
    }

    .sidebar{
        transform:translateX(-100%);

        width:250px;

        transition:transform .2s;

        z-index:1200;
    }

    .sidebar.mobile-open{
        transform:translateX(0);
    }

    .sidebar.mobile-open .nav-text,
    .sidebar.mobile-open .nav-title{
        display:block;
    }

    .sidebar.mobile-open .nav-item{
        justify-content:flex-start;
    }

    .sidebar-overlay{
        display:block;

        position:fixed;
        inset:64px 0 0;

        z-index:1100;

        border:0;

        background:rgba(0,0,0,.55);

        opacity:0;
        visibility:hidden;
    }

    .sidebar-overlay.open{
        opacity:1;
        visibility:visible;
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .home{
        padding:5px 10px 35px;
    }

    .player-page{
        padding:10px 10px 40px;
    }

    .player-title{
        font-size:19px;
    }

    .video-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:20px 10px;
    }

    .video-details{
        grid-template-columns:30px 1fr;
        gap:7px;
    }

    .avatar{
        width:29px;
        height:29px;
    }

    .video-title{
        font-size:13px;
    }

    .channel,
    .meta{
        font-size:11px;
    }

    .next{
        grid-template-columns:130px 1fr;
    }

}

@media(max-width:480px){

    .video-grid{
        grid-template-columns:1fr;
    }

    .video-title{
        font-size:15px;
    }

    .channel,
    .meta{
        font-size:13px;
    }

    .header-center{
        max-width:calc(100vw - 120px);
    }

    .search-input{
        font-size:14px;
    }

    .chips{
        padding-left:10px;
    }

    .chip{
        padding:7px 12px;
        font-size:12px;
    }

}

</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            id="menuButton"
            class="menu-btn"
            aria-label="Open menu"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"
                />
            </svg>
        </button>


        <a
            href="#"
            class="logo"
            id="homeLogo"
        >
            <span class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path
                        fill="white"
                        d="M9 7v10l8-5-8-5Z"
                    />
                </svg>
            </span>

            VideoView
        </a>

    </div>


    <div class="header-center">

        <form
            id="searchForm"
            class="search-form"
        >

            <div class="search-wrap">

                <input
                    id="searchInput"
                    class="search-input"
                    type="search"
                    placeholder="Search"
                    autocomplete="off"
                >

                <button
                    id="clearSearch"
                    class="clear-search"
                    type="button"
                    hidden
                >
                    ×
                </button>

            </div>


            <button
                class="search-submit"
                type="submit"
                aria-label="Search"
            >

                <svg viewBox="0 0 24 24">
                    <path
                        fill="currentColor"
                        d="M9.5 3a6.5 6.5 0 1 0 4.1 11.55l4.4 4.4 1.4-1.4-4.4-4.4A6.5 6.5 0 0 0 9.5 3Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"
                    />
                </svg>

            </button>

        </form>

    </div>


    <div class="header-right">

        <button
            id="themeButton"
            class="header-icon"
            aria-label="Toggle theme"
            title="Toggle theme"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12Zm0-16a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 18a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1Z"
                />
            </svg>
        </button>


        <button
            id="headerHistory"
            class="header-icon"
            aria-label="History"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="M13 3a9 9 0 1 1-7.03 3.37L3 6v5h2V9.72A7 7 0 1 0 13 5V3Zm-1 4v5.41l3.3 3.3 1.4-1.42L14 11.59V7h-2Z"
                />
            </svg>
        </button>


        <div class="profile">
            VV
        </div>

    </div>

</header>


<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside
    id="sidebar"
    class="sidebar"
>

    <div class="nav-group">

        <button
            class="nav-item active"
            id="homeNav"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="m12 3 9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8Z"
                />
            </svg>

            <span class="nav-text">
                Home
            </span>
        </button>


        <button
            class="nav-item topic-button"
            data-query="Music"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="M12 3v12.1A4 4 0 1 0 14 19V8h5V3h-7Z"
                />
            </svg>

            <span class="nav-text">
                Music
            </span>
        </button>


        <button
            class="nav-item topic-button"
            data-query="Gaming"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="M7 7h10a4 4 0 0 1 3.9 3.2L22 16a3 3 0 0 1-5.2 1.9L14.7 15H9.3l-2.1 2.9A3 3 0 0 1 2 16l1.1-5.8A4 4 0 0 1 7 7Zm1 3H6v2h2v2h2v-2h-2v-2Zm8 1.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"
                />
            </svg>

            <span class="nav-text">
                Gaming
            </span>
        </button>

    </div>


    <div class="nav-group">

        <div class="nav-title">
            You
        </div>


        <button
            class="nav-item"
            id="historyNav"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="M13 3a9 9 0 1 1-7.03 3.37L3 6v5h2V9.72A7 7 0 1 0 13 5V3Zm-1 4v5.41l3.3 3.3 1.4-1.42L14 11.59V7h-2Z"
                />
            </svg>

            <span class="nav-text">
                History
            </span>
        </button>


        <button
            class="nav-item"
            id="favoritesNav"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="m12 17.2-5.2 3 1.4-5.8-4.6-4 6-.5L12 4.4l2.4 5.5 6 .5-4.6 4 1.4 5.8-5.2-3Z"
                />
            </svg>

            <span class="nav-text">
                Favorites
            </span>
        </button>

    </div>


    <div class="nav-group">

        <div class="nav-title">
            Explore
        </div>


        <button
            class="nav-item topic-button"
            data-query="Trending"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="M13 2s2 4 2 7c0 1.5-.7 2.5-1.5 3.3C13.8 9.2 12 7 10 6c.3 4-3 5.8-3 9a5 5 0 0 0 10 0c0-3.8-2.6-7.2-4-9.3V2Z"
                />
            </svg>

            <span class="nav-text">
                Trending
            </span>
        </button>


        <button
            class="nav-item topic-button"
            data-query="Technology"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="M9 3h6v3h3v3h3v6h-3v3h-3v3H9v-3H6v-3H3V9h3V6h3V3Zm0 5v8h6V8H9Z"
                />
            </svg>

            <span class="nav-text">
                Technology
            </span>
        </button>


        <button
            class="nav-item topic-button"
            data-query="Science"
        >
            <svg viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="M9 2h6v2h-1v5l4.7 7.3A3.6 3.6 0 0 1 15.7 22H8.3a3.6 3.6 0 0 1-3-5.7L10 9V4H9V2Zm3 9-4.5 6.5c-.7 1 .1 2.5 1.3 2.5h6.4c1.2 0 2-1.5 1.3-2.5L12 11Z"
                />
            </svg>

            <span class="nav-text">
                Science
            </span>
        </button>

    </div>

</aside>


<button
    id="sidebarOverlay"
    class="sidebar-overlay"
    type="button"
    aria-label="Close menu"
></button>


<!-- =========================================================
     MAIN
========================================================= -->

<main id="main" class="main">

    <!-- TOPIC BAR -->

    <nav class="chips">

        <button
            class="chip active"
            data-query="All"
        >
            All
        </button>

        <button
            class="chip"
            data-query="Music"
        >
            Music
        </button>

        <button
            class="chip"
            data-query="Technology"
        >
            Technology
        </button>

        <button
            class="chip"
            data-query="Gaming"
        >
            Gaming
        </button>

        <button
            class="chip"
            data-query="Science"
        >
            Science
        </button>

        <button
            class="chip"
            data-query="Programming"
        >
            Programming
        </button>

        <button
            class="chip"

<script>

/* =========================================================
   API KEY
========================================================= */

const YOUTUBE_API_KEY =
    "AIzaSyClQpVsyP61i-VRNFpGm1Oq9kf6LgQF5E0";


const API =
    "https://www.googleapis.com/youtube/v3";


/* =========================================================
   STATE
========================================================= */

const state = {

    currentVideo:null,

    history:loadJSON(
        "vv_history"
    ),

    favorites:loadJSON(
        "vv_favorites"
    ),

    theme:
        localStorage.getItem(
            "vv_theme"
        ) || "dark",

    currentLibrary:"history"

};


/* =========================================================
   HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


function loadJSON(
    key
){

    try{

        const value =
            localStorage.getItem(key);

        if(!value){
            return [];
        }

        const parsed =
            JSON.parse(value);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch{
        return [];
    }

}


function saveJSON(
    key,
    value
){

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    init
);


function init(){

    applyTheme();

    bindEvents();

    renderSkeleton();

    loadHome();

}


/* =========================================================
   EVENTS
========================================================= */

function bindEvents(){

    $("menuButton")
        .addEventListener(
            "click",
            toggleSidebar
        );


    $("sidebarOverlay")
        .addEventListener(
            "click",
            closeSidebar
        );


    $("themeButton")

            "click",
            toggleTheme
        );


    $("searchForm")
        .addEventListener(
            "submit",
            searchSubmit
        );


    $("clearSearch")
        .addEventListener(
            "click",
            clearSearch
        );


    $("homeLogo")
        .addEventListener(
            "click",
            event=>{
                event.preventDefault();
                showHome();
            }
        );


    $("homeNav")
        .addEventListener(
            "click",
            loadHome
        );


    $("historyNav")
        .addEventListener(
            "click",
            ()=>{
                openLibrary("history");
            }
        );


    $("favoritesNav")
        .addEventListener(
            "click",
            ()=>{
                openLibrary("favorites");
            }
        );


    $("headerHistory")
        .addEventListener(
            "click",
            ()=>{
                openLibrary("history");
            }
        );


    $("favoriteButton")
        .addEventListener(
            "click",
            toggleFavorite
        );


    $("copyButton")
        .addEventListener(
            "click",
            copyURL
        );


    $("shareButton")
        .addEventListener(
            "click",
            shareVideo
        );


    $("clearLibrary")
        .addEventListener(
            "click",
            clearLibrary
        );


    document
        .querySelectorAll(
            ".chip"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    ()=>{
                        activateChip(
                            button.dataset.query
                        );

                        if(
                            button.dataset.query ===
                            "All"
                        ){
                            loadHome();
                        }else{
                            searchVideos(
                                button.dataset.query
                            );
                        }
                    }
                );

            }
        );


    document
        .querySelectorAll(
            ".topic-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    ()=>{

                        searchVideos(
                            button.dataset.query
                        );

                        closeSidebar();

                    }
                );

            }
        );


    document
        .querySelectorAll(
            ".library-tab"
        )
        .forEach(
            tab=>{

                tab.addEventListener(
                    "click",
                    ()=>{

                        state.currentLibrary =
                            tab.dataset.library;

                        document
                            .querySelectorAll(
                                ".library-tab"
                            )
                            .forEach(
                                other => {

                                    other.classList.toggle(
                                        "active",
                                        other === tab
                                    );

                                }
                            );

                        renderLibrary();
                    }
                );

            }
        );


    $("searchInput")
        .addEventListener(
            "input",
            event=>{
                $("clearSearch").hidden =
                    !event.target.value;
            }
        );


    document.addEventListener(
        "keydown",
        event=>{

            if(
                event.key === "/" &&
                document.activeElement.tagName !==
                    "INPUT"
            ){

                event.preventDefault();

                $("searchInput")
                    .focus();
            }


            if(
                event.key === "Escape"
            ){
                closeSidebar();
            }

        }
    );

}


/* =========================================================
   HOME
========================================================= */

async function loadHome(){

    showHome();

    $("feedTitle").textContent =
        "Recommended";


    renderSkeleton();


    try{

        const url =
            new URL(
                API +
                "/videos"
            );


        url.searchParams.set(
            "part",
            "snippet,statistics"
        );


        url.searchParams.set(
            "chart",
            "mostPopular"
        );


        url.searchParams.set(
            "regionCode",
            "IN"
        );


        url.searchParams.set(
            "maxResults",
            "24"
        );


        url.searchParams.set(
            "key",
            YOUTUBE_API_KEY
        );


        const response =
            await fetch(
                url.toString()
            );


        if(
            !response.ok
        ){

            throw new Error(
                await apiError(
                    response
                )
            );
        }


        const data =
            await response.json();


        renderVideos(
            data.items || []
        );

    }catch(error){

        showFeedError(
            error.message
        );

    }

}


/* =========================================================
   SEARCH
========================================================= */

function searchSubmit(
    event
){

    event.preventDefault();


    const query =
        $("searchInput")
            .value
            .trim();


    if(!query){
        loadHome();
        return;
    }


    searchVideos(
        query
    );

}


async function searchVideos(
    query
){

    showHome();

    $("feedTitle").textContent =
        query;


    renderSkeleton();


    try{

        const url =
            new URL(
                API +
                "/search"
            );


        url.searchParams.set(
            "part",
            "snippet"
        );


        url.searchParams.set(
            "q",
            query
        );


        url.searchParams.set(
            "type",
            "video"
        );


        url.searchParams.set(
            "maxResults",
            "24"
        );


        url.searchParams.set(
            "key",
            YOUTUBE_API_KEY
        );


        const response =
            await fetch(
                url.toString()
            );


        if(
            !response.ok
        ){

            throw new Error(
                await apiError(
                    response
                )
            );
        }


        const data =
            await response.json();


        const videos =
            (data.items || [])
                .filter(
                    item =>
                        item.id?.videoId
                )
                .map(
                    item => ({
                        id:
                            item.id.videoId,

                        snippet:
                            item.snippet
                    })
                );


        renderVideos(
            videos
        );

    }catch(error){

        showFeedError(
            error.message
        );

    }

}


/* =========================================================
   VIDEO CARD
========================================================= */

function renderVideos(
    videos
){

    $("videoGrid").innerHTML =
        "";


    if(
        !videos.length
    ){

        $("videoGrid").innerHTML =
            `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:70px;
                color:var(--muted);
            ">
                No videos found.
            </div>
            `;

        return;
    }


    videos.forEach(
        video=>{

            $("videoGrid")
                .appendChild(
                    createVideoCard(
                        video
                    )
                );
        }
    );

}


function createVideoCard(
    video
){

    const snippet =
        video.snippet || {};


    const card =
        document.createElement(
            "article"
        );

    card.className =
        "video-card";


    const thumb =
        document.createElement(
            "div"
        );

    thumb.className =
        "thumbnail";


    const img =
        document.createElement(
            "img"
        );


    img.src =
        getThumbnail(
            video.id
        );


    img.alt =
        clean(
            snippet.title ||
            "YouTube video"
        );


    img.loading =
        "lazy";


    thumb.appendChild(
        img
    );


    const details =
        document.createElement(
            "div"
        );

    details.className =
        "video-details";


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";


    const avatarImg =
        document.createElement(
            "img"
        );


    avatarImg.src =
        getAvatar(
            snippet.channelTitle
        );


    avatarImg.alt =
        "";


    avatar.appendChild(
        avatarImg
    );


    const info =
        document.createElement(
            "div"
        );


    const title =
        document.createElement(
            "h3"
        );

    title.className =
        "video-title";

    title.textContent =
        clean(
            snippet.title ||
            "YouTube video"
        );


    const channel =
        document.createElement(
            "p"
        );

    channel.className =
        "channel";

    channel.textContent =
        snippet.channelTitle ||
        "YouTube";


    const meta =
        document.createElement(
            "p"
        );

    meta.className =
        "meta";

    meta.textContent =
        timeAgo(
            snippet.publishedAt
        );


    info.append(
        title,
        channel,
        meta
    );


    details.append(
        avatar,
        info
    );


    card.append(
        thumb,
        details
    );


    card.addEventListener(
        "click",
        ()=>{
            openVideo(
                video
            );
        }
    );


    return card;
}


/* =========================================================
   OPEN VIDEO
========================================================= */

async function openVideo(
    video
){

    if(
        !video?.id
    ){
        return;
    }


    let title =
        clean(
            video.snippet?.title ||
            "YouTube video"
        );


    let description =
        video.snippet?.description ||
        "";


    let channelTitle =
        video.snippet?.channelTitle ||
        "YouTube";


    state.currentVideo = {

        id:
            video.id,

        title,

        description,

        channelTitle
    };


    /*
     * Save history before opening the player.
     */

    saveHistory(
        state.currentVideo
    );


    updatePlayerPage();


    /*
     * Direct official YouTube embed.
     *
     * This is intentionally used rather than requiring
     * the JavaScript IFrame API to create the initial player.
     */

    const embedURL =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(
            video.id
        ) +
        "?rel=0" +
        "&playsinline=1";


    $("youtubeFrame").src =
        embedURL;


    $("youtubeFrame").onload =
        ()=>{
            hidePlayerError();
        };


    /*
     * Give YouTube a little time to report/embed.
     * If nothing works, the fallback button remains available.
     */

    setTimeout(
        ()=>{
            /*
             * We cannot inspect YouTube's cross-origin iframe
             * contents. Therefore we do not claim success/failure
             * based on iframe DOM inspection.
             *
             * The Open on YouTube fallback remains available.
             */
        },
        2500
    );


    loadRecommendations(
        state.currentVideo
    );


    showPlayer();

}


/* =========================================================
   PLAYER UI
========================================================= */

function updatePlayerPage(){

    const video =
        state.currentVideo;


    $("playerTitle").textContent =
        video.title;


    $("playerDescription").textContent =
        video.description ||
        "No description available.";


    const url =
        youtubeURL(
            video.id

    $("openYoutube").href =
        url;


    $("fallbackYoutube").href =
        url;


    updateFavoriteButton();

}


function showPlayer(){

    $("homePage").style.display =
        "none";


    $("playerPage").style.display =
        "block";


    $("libraryPage").style.display =
        "none";


    window.scrollTo(
        {
            top:0,
            behavior:"smooth"
        }
    );

}


function hidePlayerError(){

    $("playerError")
        .classList.remove(
            "show"
        );

}


function showPlayerError(){

    $("playerError")
        .classList.add(
            "show"
        );

}


/* =========================================================
   RECOMMENDATIONS
========================================================= */

async function loadRecommendations(
    current
){

    const queries = [];


    /*
     * Title-based query.
     */

    const words =
        current.title
            .replace(
                /[^\p{L}\p{N}\s]/gu,
                " "
            )
            .split(/\s+/)
            .filter(
                word =>
                    word.length > 3
            )
            .slice(
                0,
                5
            )
            .join(" ");


    if(words){
        queries.push(
            words
        );
    }


    /*
     * Channel signal.
     */

    if(
        current.channelTitle
    ){

        queries.push(
            current.channelTitle
        );
    }


    /*
     * History signal.
     */

    state.history
        .slice(
            0,
            3
        )
        .forEach(
            item=>{

                if(
                    item.title
                ){

                    queries.push(
                        item.title
                            .split(/\s+/)
                            .filter(
                                word =>
                                    word.length >
                                    4
                            )
                            .slice(
                                0,
                                4
                            )
                            .join(" ")
                    );
                }

            }
        );


    const unique =
        [
            ...new Set(
                queries.filter(
                    Boolean
                )
            )
        ]
        .slice(
            0,
            3
        );


    const results =
        new Map();


    for(
        const query
        of unique
    ){

        try{

            const url =
                new URL(
                    API +
                    "/search"
                );


            url.searchParams.set(
                "part",
                "snippet"
            );


            url.searchParams.set(
                "q",
                query
            );


            url.searchParams.set(
                "type",
                "video"
            );


            url.searchParams.set(
                "maxResults",
                "8"
            );


            url.searchParams.set(
                "key",
                YOUTUBE_API_KEY
            );


            const response =
                await fetch(
                    url.toString()
                );


            if(
                !response.ok
            ){
                continue;
            }


            const data =
                await response.json();


            (data.items || [])
                .forEach(
                    item=>{

                        const id =
                            item.id?.videoId;


                        if(
                            id &&
                            id !== current.id
                        ){

                            results.set(
                                id,
                                {
                                    id,

                                    snippet:
                                        item.snippet
                                }
                            );
                        }

                    }
                );

        }catch{
            continue;
        }

    }


    renderUpNext(
        [
            ...results.values()
        ]
        .slice(
            0,
            12
        )
    );

}


function renderUpNext(
    videos
){

    $("upNext").innerHTML =
        "";


    if(
        !videos.length
    ){

        $("upNext").innerHTML =
            `
            <div style="
                color:var(--muted);
                font-size:14px;
            ">
                No recommendations available.
            </div>
            `;

        return;
    }


    videos.forEach(
        video=>{

            const item =
                document.createElement(
                    "article"
                );

            item.className =
                "next";


            const thumb =
                document.createElement(
                    "div"
                );

            thumb.className =
                "next-thumb";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                getThumbnail(
                    video.id
                );


            img.alt =
                clean(
                    video.snippet?.title ||
                    "Video"
                );


            thumb.appendChild(
                img
            );


            const info =
                document.createElement(
                    "div"
                );


            const title =
                document.createElement(
                    "p"
                );


            title.className =
                "next-title";

            title.textContent =
                clean(
                    video.snippet?.title ||
                    "YouTube video"
                );


            const channel =
                document.createElement(
                    "p"
                );


            channel.className =
                "next-channel";

            channel.textContent =
                video.snippet?.channelTitle ||
                "YouTube";


            info.append(
                title,
                channel
            );


            item.append(
                thumb,
                info
            );


            item.addEventListener(
                "click",
                ()=>{
                    openVideo(
                        video
                    );
                }
            );


            $("upNext")
                .appendChild(
                    item
                );

        }
    );

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory(
    video
){

    const item = {

        id:
            video.id,

        title:
            video.title,

        channelTitle:
            video.channelTitle,

        thumbnail:
            getThumbnail(
                video.id
            ),

        savedAt:
            Date.now()
    };


    state.history =
        state.history.filter(
            old =>
                old.id !==
                item.id
        );


    state.history.unshift(
        item
    );


    state.history =
        state.history.slice(
            0,
            50
        );


    saveJSON(
        "vv_history",
        state.history
    );

}


function renderLibrary(){

    const items =
        state.currentLibrary ===
            "history"

            ? state.history

            : state.favorites;


    const grid =
        $("libraryGrid");


    grid.innerHTML =
        "";


    if(
        !items.length
    ){

        grid.innerHTML =
            `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:70px;
                color:var(--muted);
            ">
                Nothing here yet.
            </div>
            `;

        return;
    }


    items.forEach(
        item=>{

            grid.appendChild(
                createVideoCard({

                    id:
                        item.id,

                    snippet:{

                        title:
                            item.title,

                        channelTitle:
                            item.channelTitle,

                        publishedAt:
                            item.savedAt,

                        thumbnails:{
                            medium:{
                                url:
                                    item.thumbnail
                            }
                        }
                    }
                })
            );

        }
    );

}


function openLibrary(
    type
){

    state.currentLibrary =
        type;


    $("homePage").style.display =
        "none";


    $("playerPage").style.display =
        "none";


    $("libraryPage").style.display =
        "block";


    $("libraryTitle").textContent =
        type === "history"
            ? "History"
            : "Favorites";


    document
        .querySelectorAll(
            ".library-tab"
        )
        .forEach(
            tab=>{

                tab.classList.toggle(
                    "active",
                    tab.dataset.library ===
                        type
                );
            }
        );


    renderLibrary();

    closeSidebar();

}


/* =========================================================
   FAVORITES
========================================================= */

function toggleFavorite(){

    if(
        !state.currentVideo
    ){
        return;
    }


    const id =
        state.currentVideo.id;


    const exists =
        state.favorites.some(
            item =>
                item.id ===
                id
        );


    if(
        exists
    ){

        state.favorites =
            state.favorites.filter(
                item =>
                    item.id !==
                    id
            );


        showToast(
            "Removed from favorites"
        );

    }else{

        state.favorites.unshift({

            id,

            title:
                state.currentVideo.title,

            channelTitle:
                state.currentVideo.channelTitle,

            thumbnail:
                getThumbnail(
                    id
                ),

            savedAt:
                Date.now()
        });


        showToast(
            "Saved to favorites"
        );
    }


    saveJSON(
        "vv_favorites",
        state.favorites
    );


    updateFavoriteButton();

}


function updateFavoriteButton(){

    if(
        !state.currentVideo
    ){
        return;
    }


    const active =
        state.favorites.some(
            item =>
                item.id ===
                state.currentVideo.id
        );


    $("favoriteButton")
        .classList.toggle(
            "active",
            active
        );


    $("favoriteButton")
        .textContent =
        active
            ? "✓ Saved"
            : "☆ Save";
}


/* =========================================================
   CLEAR LIBRARY
========================================================= */

function clearLibrary(){

    if(
        !confirm(
            `Clear all ${
                state.currentLibrary ===
                "history"
                    ? "history"
                    : "favorites"
            }?`
        )
    ){
        return;
    }


    if(
        state.currentLibrary ===
        "history"
    ){

        state.history =
            [];

        localStorage.removeItem(
            "vv_history"
        );

    }else{

        state.favorites =
            [];

        localStorage.removeItem(
            "vv_favorites"
        );
    }


    renderLibrary();

    showToast(
        "Cleared"
    );

}

/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

    if(

    ){

        $("sidebar")

                "mobile-open"
            );

        $("sidebarOverlay")
            .classList.toggle(

            );

         */

                .dataset.collapsed ===

            .dataset.collapsed =

/* =========================================================
   COPY
========================================================= */

async function copyURL(){

    if(
        !state.currentVideo
    ){
        return;
    }


    const url =
        youtubeURL(
            state.currentVideo.id
        );


    try{

        if(
            navigator.clipboard
        ){

            await navigator.clipboard.writeText(
                url
            );

            showToast(
                "URL copied"
            );

            return;
        }

    }catch{
        /* fallback */
    }


    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        url;


    document.body.appendChild(
        textarea
    );


    textarea.select();


    document.execCommand(
        "copy"
    );


    textarea.remove();


    showToast(
        "URL copied"
    );
}


/* =========================================================
   SHARE
========================================================= */

async function shareVideo(){

    if(
        !state.currentVideo
    ){
        return;
    }


    const data = {

        title:
            state.currentVideo.title,

        text:
            state.currentVideo.title,

        url:
            youtubeURL(
                state.currentVideo.id
            )
    };


    if(
        navigator.share
    ){

        try{

            await navigator.share(
                data
            );

            return;

        }catch(
            error
        ){

            if(
                error.name ===
                "AbortError"
            ){
                return;
            }
        }
    }


    copyURL();

}


/* =========================================================
   UTILITIES
========================================================= */

function youtubeURL(
    id
){

    return (
        "https://www.youtube.com/watch?v=" +
        encodeURIComponent(id)
    );
}


function getThumbnail(
    id
){

    return (
        "https://i.ytimg.com/vi/" +
        encodeURIComponent(id) +
        "/hqdefault.jpg"
    );
}


function getAvatar(
    name
){

    const value =
        String(
            name ||
            "YT"
        )
        .trim()
        .slice(
            0,
            2
        );


    return (
        "https://ui-avatars.com/api/" +
        "?name=" +
        encodeURIComponent(value) +
        "&background=333333" +
        "&color=ffffff" +
        "&size=64"
    );
}


function clean(
    value
){

    const div =
        document.createElement(
            "div"
        );


    div.innerHTML =
        String(value);


    return (
        div.textContent ||
        div.innerText ||
        ""
    );
}


function timeAgo(
    date
){

    if(
        !date
    ){
        return "";
    }


    const difference =
        Date.now() -
        new Date(
            date
        ).getTime();


    const day =
        86400000;


    if(
        difference < day
    ){
        return "today";
    }


    const days =
        Math.floor(
            difference /
            day
        );


    if(
        days < 7
    ){
        return `${days} days ago`;
    }


    if(
        days < 30
    ){
        return `${Math.floor(days / 7)} weeks ago`;
    }


    if(
        days < 365
    ){
        return `${Math.floor(days / 30)} months ago`;
    }


    return `${Math.floor(days / 365)} years ago`;
}


async function apiError(
    response
){

    try{

        const data =
            await response.json();

        return (
            data?.error?.message ||
            `API request failed (${response.status})`
        );

    }catch{

        return (
            `API request failed (${response.status})`
        );
    }
}
